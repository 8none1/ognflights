name: Build and publish image

# Build the collector image and push it to GHCR on changes that affect it.
# perceptron then runs the prebuilt image (docker compose pull) instead of building.

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "ognflights/**"
      - "replay/**"
      - "publish/**"
      - "cli.py"
      - ".github/workflows/build-image.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
