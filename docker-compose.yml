# Deploy on perceptron. Data (SQLite year files, kept indefinitely) persists in ./data.
#   Once the GHCR package is public:  docker compose pull && docker compose up -d
#   Otherwise (build locally):        docker compose up -d --build
services:
  ognflights:
    image: ghcr.io/8none1/ognflights:latest
    build: .
    container_name: ognflights
    restart: unless-stopped
    # Run a real init (tini) as PID 1 to reap any orphaned/reparented children. The app
    # already runs auto-maintenance inline (gc.autoDetach=false) so git no longer leaks
    # zombies, but python-as-PID-1 has no generic reaper - this is the belt-and-braces.
    init: true
    ports:
      - "8477:8080"          # http://perceptron:8477/  (replay)  and /stats  -- change host port if it clashes
    volumes:
      - ./data:/app/data
      - ./secrets/deploy_key:/keys/deploy_key:ro   # SSH deploy key for the public-data push (never in the image)
      # For a fast dev loop (run code from the checkout, no image rebuild) add the overlay:
      #   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
      # Normal deploy uses the prebuilt image: docker compose pull && docker compose up -d
    environment:
      # Hourly public-data publisher. OFF by default; set OGNFLIGHTS_PUBLISH=1 to enable.
      OGNFLIGHTS_PUBLISH: "1"
      OGNFLIGHTS_PUBLISH_REMOTE: "git@github.com:8none1/ognflights.git"
      OGNFLIGHTS_PUBLISH_BRANCH: "public-data"
      OGNFLIGHTS_DEPLOY_KEY: "/keys/deploy_key"
      OGNFLIGHTS_PUBLISH_DAYS: "7"
      OGNFLIGHTS_PUBLISH_INTERVAL_S: "3600"
      OGNFLIGHTS_PUBLISH_WORKDIR: "/app/data/.publish-repo"

  # Cloudflare Tunnel: makes the dashboard reachable publicly (e.g. ogn.8none1.org) without a
  # public IP or inbound ports - cloudflared dials OUT to Cloudflare. Same network as ognflights
  # so the tunnel's ingress can reach http://ognflights:8080. Token lives in a git-ignored .env
  # (CLOUDFLARED_TOKEN=...); the tunnel just won't connect if it's unset.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ognflights-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TOKEN:-}
    depends_on:
      - ognflights
