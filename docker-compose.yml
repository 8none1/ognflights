# Deploy on perceptron: uses the prebuilt image from GHCR (built by CI on push to main).
#   docker compose pull && docker compose up -d      # update to the latest image
# Data (SQLite year files, kept indefinitely) persists in ./data on the host.
# To build locally instead: `docker build -t ghcr.io/8none1/ognflights .`
services:
  ognflights:
    image: ghcr.io/8none1/ognflights:latest
    container_name: ognflights
    restart: unless-stopped
    pull_policy: always
    ports:
      - "8477:8080"          # http://perceptron:8477/  (replay)  and /stats  -- change host port if it clashes
    volumes:
      - ./data:/app/data
